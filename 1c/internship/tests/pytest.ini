[pytest]
; Конфигурация прогона тестов стенда RIH.
; Маркеры соответствуют уровням тестов из task_266: L0-L4.
testpaths = unit contract integration e2e load golden_path legacy
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    unit: L1 - модульные тесты без внешних зависимостей
    contract: L2 - контрактные тесты API партнёров (нужен docker-compose.test.yml)
    integration: L3 - интеграционные тесты компонентов стенда
    e2e: L3 - сквозной сценарий по API: магазин -> RIH -> партнёры -> трекер
    load: L4 - нагрузочные прогоны (медленные, запускать отдельно)
    golden_path: L3 - золотой путь года и негативная ветка
    legacy: L1 - characterization-тесты легаси-кода
    slow: тест дольше 10 секунд
; pytest-asyncio: фикстуры живут в рамках одной функции (task_141, task_232)
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
