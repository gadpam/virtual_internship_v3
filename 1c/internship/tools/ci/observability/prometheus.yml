# Prometheus: скрейп-конфиг учебного стенда RIH (task_271).
#
# Источники метрик:
#   * metrics_exporter — метрики интеграций 1С (rih_*);
#   * rabbitmq — глубина очередей и скорость публикации;
#   * postgres_exporter — состояние СУБД витрин;
#   * nginx-prometheus-exporter — латентность точки входа.
#
# Правила алертов вынесены в alert_rules.yml (task_272): там 6 алертов по симптомам.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    stand: rih-full
    project: RetailIntegrationHub

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: rih
    metrics_path: /metrics
    static_configs:
      - targets: ["metrics_exporter:8025"]
        labels:
          component: exporter
          tier: application

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          component: broker
          tier: infrastructure

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          component: db
          tier: infrastructure

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          component: entrypoint
          tier: infrastructure

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
