# Конфигурация RabbitMQ для учебного стенда RIH (task_111, task_112).
# Подключаем определения из definitions.json и ограничиваем ресурсы,
# чтобы контейнер не «съедал» память на ноутбуке стажёра.

listeners.tcp.default = 5672
management.tcp.port = 15672

load_definitions = /etc/rabbitmq/definitions.json

# Память и диск: учебный стенд, лимиты жёсткие и понятные
vm_memory_high_watermark.relative = 0.4
disk_free_limit.absolute = 1GB

# Таймауты: сердечки помогают быстро замечать обрыв соединения (task_127)
heartbeat = 30
channel_max = 128

# Логи — в stdout, чтобы их забирал docker compose logs
log.console = true
log.console.level = info
log.file = false
