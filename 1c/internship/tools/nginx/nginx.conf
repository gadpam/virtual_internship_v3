# Единая точка входа учебного стенда RIH.
#
# Зачем прокси, если каждый сервис имеет свой порт (task_260):
#   1. Клиент 1С знает один базовый URL — смена порта партнёра не требует правки конфигурации.
#   2. Здесь же живут TLS, лимиты частоты, отсечение «лишних» путей и единый формат ошибок.
#   3. Логи доступа в одном месте — расследование инцидента (task_114, task_274) начинается отсюда.
#
# Все upstream'ы — внутренние имена сервисов docker-compose. Наружу опубликованы
# только порты 80/443 этого контейнера.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Формат лога с correlationId: его передаёт 1С в заголовке X-Correlation-Id
    # (практика из task_274). Если заголовка нет — ставим прочерк, чтобы колонка
    # не «съезжала» при разборе лога.
    log_format  rih_main  '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          'rt=$request_time urt=$upstream_response_time '
                          'upstream=$upstream_addr corr="$http_x_correlation_id" '
                          'ua="$http_user_agent"';

    access_log  /var/log/nginx/access.log  rih_main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;                 # не раскрываем версию nginx

    client_max_body_size 25m;               # выгрузки каталога могут быть большими

    # Ограничение частоты: зона на ключ клиента (task_93, task_133).
    # 20r/s с всплеском 40 — учебное значение, настраивается через .env.
    limit_req_zone  $binary_remote_addr zone=rih_perip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=rih_conn:10m;

    # Единая страница ошибки: не отдаём клиенту стектрейсы и версию сервера
    error_page 500 502 503 504 /_rih_error;

    upstream shop      { server mock_shop_api:8020;      keepalive 16; }
    upstream loyalty   { server mock_loyalty_api:8021;   keepalive 16; }
    upstream tk        { server mock_tk_api:8022;        keepalive 16; }
    upstream bank      { server mock_bank_ws:8023;       keepalive 8;  }
    upstream tracker   { server mock_tracker_api:8024;   keepalive 8;  }
    upstream ai        { server ai_service:8010;         keepalive 8;  }
    upstream metrics   { server metrics_exporter:8025;   keepalive 4;  }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # --- Проверка живости всего стенда: агрегирует /health всех сервисов ---
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","entrypoint":"nginx","stand":"dev"}';
        }

        # --- Маршрутизация по префиксу: один базовый URL для клиента 1С ---
        location /shop/ {
            limit_req   zone=rih_perip burst=40 nodelay;
            limit_conn  rih_conn 50;
            proxy_pass  http://shop/;
            include     /etc/nginx/proxy_common.inc;
        }

        location /loyalty/ {
            limit_req   zone=rih_perip burst=40 nodelay;
            proxy_pass  http://loyalty/;
            include     /etc/nginx/proxy_common.inc;
        }

        # Транспортная компания имеет собственный жёсткий лимит (10/мин):
        # проксируем 429 и Retry-After как есть, чтобы клиент 1С учился их уважать.
        location /tk/ {
            limit_req   zone=rih_perip burst=20 nodelay;
            proxy_pass  http://tk/;
            include     /etc/nginx/proxy_common.inc;
            proxy_intercept_errors off;
        }

        # SOAP банка: нужен большой таймаут чтения и text/xml
        location /bank {
            limit_req   zone=rih_perip burst=10 nodelay;
            proxy_pass  http://bank/bank;
            include     /etc/nginx/proxy_common.inc;
            proxy_read_timeout 60s;
        }

        location /tracker/ {
            limit_req   zone=rih_perip burst=20 nodelay;
            proxy_pass  http://tracker/;
            include     /etc/nginx/proxy_common.inc;
        }

        # AI-сервис: ответы могут генерироваться долго, поэтому таймауты больше.
        # Для /api/v1/ask включён буферизованный ответ целиком (не потоковый),
        # чтобы 1С-клиент получал документ одной порцией.
        location /ai/ {
            limit_req   zone=rih_perip burst=10 nodelay;
            proxy_pass  http://ai/;
            include     /etc/nginx/proxy_common.inc;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering on;
        }

        # Метрики — только из внутренней сети (task_133). Наружу отдаём
        # исключительно /metrics для Prometheus-скрейпа и ничего больше.
        location = /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://metrics/metrics;
            include    /etc/nginx/proxy_common.inc;
        }

        # Отладочные и служебные пути партнёров наружу не отдаём
        location ~ ^/(docs|redoc|openapi\.json) {
            deny all;
        }

        location = /_rih_error {
            internal;
            default_type application/json;
            return 502 '{"code":"UPSTREAM_UNAVAILABLE","message":"сервис-партнёр недоступен","details":null,"incidentId":"$request_id","timestamp":"$time_iso8601"}';
        }

        location / {
            return 404 '{"code":"NOT_FOUND","message":"неизвестный путь стенда","incidentId":"$request_id"}';
        }
    }

    # HTTPS с самоподписанным сертификатом для учебного стенда (task_260, task_134).
    # Сертификат генерируется скриптом tools/nginx/certs/generate.sh и в Git не попадает.
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/mock.crt;
        ssl_certificate_key /etc/nginx/certs/mock.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            return 308 http://$host:8080$request_uri;
        }
    }
}
